<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Needle 2 · WebGPU 推理</title><link rel="stylesheet" href="/src/style.css"/></head>
<body><main class="app"><header><div><div class="eyebrow">NEEDLE 2 / LOCAL INFERENCE</div><h1>浏览器里的 Needle</h1><p>使用 WebGPU 在本地运行模型，提示词和工具定义不会离开浏览器。</p></div><div id="gpuStatus" class="status">检测 WebGPU…</div></header><section class="grid"><aside class="card settings"><label>模型文件（.cact）</label><input id="modelFile" type="file" accept=".cact"/><div id="modelInfo" class="muted">尚未加载模型</div><label>最大生成 token</label><input id="maxTokens" type="number" min="1" max="512" value="96"/><label>工具 JSON</label><textarea id="tools" spellcheck="false">[]</textarea><button id="loadDemo" class="secondary">填入示例工具</button></aside><section class="card chat"><div id="messages" class="messages"><div class="empty">加载 .cact 模型后，输入请求开始推理。</div></div><div class="composer"><textarea id="query" rows="2" placeholder="例如：把卧室灯调到 20%"></textarea><button id="send">运行</button></div><div id="progress" class="progress"></div></section></section><footer>WebGPU · CQ 权重解码 · greedy decoding <span id="timing"></span></footer></main><script src="/src/cact-header-compat.js"></script><script type="module" src="/src/webgpu-main.ts"></script></body></html>
