name: one-shot metrics fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix forward TPS calculation and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/webgpu-main.ts')
          s = p.read_text()
          old = '${ids.length / (elapsed / 1000)).toFixed(2)} tok/s'
          new = '${((i === 0 ? ids.length : 1) / (elapsed / 1000)).toFixed(2)} tok/s'
          if old not in s:
              raise SystemExit('expected TPS expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/needle-webui-metrics-fix.yml .github/workflows/.needle-webui-metrics-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/webgpu-main.ts .github/workflows
          git commit -m 'fix: separate forward TPS from prefill TPS'
          git push
